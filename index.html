<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Closed</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            color:#fff;
        }

        .container{
            max-width:650px;
            width:90%;
            text-align:center;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(10px);
            padding:50px 40px;
            border-radius:20px;
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 15px 40px rgba(0,0,0,.3);
        }

        h1{
            font-size:42px;
            color:#ff4d4d;
            margin-bottom:20px;
        }

        p{
            font-size:18px;
            line-height:1.7;
            color:#ddd;
        }

        .admins{
            margin-top:30px;
            background:rgba(255,255,255,0.08);
            padding:20px;
            border-radius:12px;
        }

        .admins h2{
            color:#4fc3f7;
            margin-bottom:15px;
            font-size:24px;
        }

        .admins p{
            font-size:20px;
            color:#fff;
            margin:8px 0;
            font-weight:600;
        }

        footer{
            margin-top:35px;
            font-size:14px;
            color:#aaa;
        }

        @media(max-width:600px){
            h1{
                font-size:32px;
            }

            p{
                font-size:16px;
            }

            .admins p{
                font-size:18px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🚧 Website Closed</h1>

    <p>
        This website has been closed and is currently unavailable.
        <br><br>
        For any queries, support, or assistance, please contact one of the administrators listed below.
    </p>

    <div class="admins">
        <h2>Administrators</h2>

        <p>👤 Samir J. Sarmah</p>
        <p>👤 Koushik Choudhury</p>
    </div>

    <footer>
        Thank you for your understanding.
    </footer>

</div>

</body>
</html>
